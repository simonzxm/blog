name: Publish
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install -r requirements.txt
      - run: mkdocs build --clean
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: site
          folder: site
